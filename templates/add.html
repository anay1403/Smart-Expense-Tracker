<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Finance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="topbar">
            <h1>Add New Expense</h1>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Dashboard</a>
        </header>

        <section class="ocr-card">
            <h2>Scan Receipt (OCR)</h2>
            <p style="margin:0 0 0.75rem; font-size:0.85rem; color:var(--text-secondary);">
                Upload a receipt photo to automatically extract the merchant, amount, date, and category in your browser.
            </p>
            <input type="file" id="receiptFile" accept="image/*">
            <img id="receiptPreview" class="ocr-preview" alt="Receipt preview">
            <div id="ocrStatus" class="ocr-status"></div>

            <details style="margin-top:0.85rem;">
                <summary style="cursor:pointer; font-size:0.82rem; font-family:var(--font-mono); color:var(--navy);">
                    Or paste receipt text directly
                </summary>
                <div style="margin-top:0.5rem;">
                    <textarea id="receiptRawText" rows="4" placeholder="Paste receipt text (merchant, date, total)..."></textarea>
                    <button type="button" id="parseTextBtn" class="btn btn-secondary btn-sm" style="margin-top:0.45rem;">
                        Extract Fields from Text
                    </button>
                </div>
            </details>
        </section>

        <section class="form-card">
            {% set submit_label = 'Log Expense' %}
            {% include '_expense_form.html' %}
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('expense_date');
            if (!dateInput.value) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
                dateInput.max = today;
            }

            const receiptInput = document.getElementById('receiptFile');
            const previewImg = document.getElementById('receiptPreview');
            const statusEl = document.getElementById('ocrStatus');
            const rawTextArea = document.getElementById('receiptRawText');
            const parseTextBtn = document.getElementById('parseTextBtn');

            async function parseReceiptTextOnServer(rawText) {
                const csrfInput = document.querySelector('input[name="csrf_token"]');
                const resp = await fetch('{{ url_for("api_parse_receipt") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfInput ? csrfInput.value : ''
                    },
                    body: JSON.stringify({ text: rawText })
                });
                if (!resp.ok) {
                    statusEl.textContent = 'Could not parse receipt fields. Please fill manually.';
                    return;
                }
                const parsed = await resp.json();
                if (parsed.description) document.getElementById('description').value = parsed.description;
                if (parsed.amount) document.getElementById('amount').value = parsed.amount;
                if (parsed.category) document.getElementById('category').value = parsed.category;
                if (parsed.expense_date) document.getElementById('expense_date').value = parsed.expense_date;
                statusEl.textContent = 'Receipt parsed. Please review the auto-filled fields before saving.';
            }

            parseTextBtn.addEventListener('click', async function() {
                const text = rawTextArea.value.trim();
                if (!text) {
                    statusEl.textContent = 'Please paste some receipt text first.';
                    return;
                }
                statusEl.textContent = 'Extracting fields...';
                await parseReceiptTextOnServer(text);
            });

            receiptInput.addEventListener('change', async function() {
                const file = this.files && this.files[0];
                if (!file) return;

                previewImg.src = URL.createObjectURL(file);
                previewImg.style.display = 'block';

                if (typeof Tesseract === 'undefined') {
                    statusEl.textContent = 'OCR engine unavailable offline. Use "Or paste receipt text directly" or fill manually.';
                    return;
                }

                statusEl.textContent = 'Initializing OCR engine...';
                let worker = null;
                try {
                    worker = await Tesseract.createWorker('eng', 1, {
                        logger: (m) => {
                            if (m && m.status) {
                                const pct = typeof m.progress === 'number' ? ` (${Math.round(m.progress * 100)}%)` : '';
                                statusEl.textContent = `OCR: ${m.status}${pct}`;
                            }
                        }
                    });
                    const result = await worker.recognize(file);
                    const rawText = (result && result.data && result.data.text) ? result.data.text.trim() : '';
                    if (!rawText) {
                        statusEl.textContent = 'Could not detect readable text on this image. Please enter details manually.';
                        return;
                    }
                    rawTextArea.value = rawText;
                    await parseReceiptTextOnServer(rawText);
                } catch (err) {
                    statusEl.textContent = 'OCR scan failed. You can paste receipt text below or enter details manually.';
                } finally {
                    if (worker) {
                        try { await worker.terminate(); } catch (_) {}
                    }
                }
            });
        });
    </script>
</body>
</html>
